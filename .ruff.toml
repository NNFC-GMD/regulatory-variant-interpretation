# Lint/format config for workflows/ and tests/, read alike by `pixi run lint`,
# `pixi run fmt` and any editor, so they cannot disagree.
line-length = 120
indent-width = 4
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# B905 (zip() without strict=): the zips here pair arrays of one length by construction.
ignore = ["B905"]

[format]
indent-style = "space"
