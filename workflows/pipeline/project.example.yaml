# project.example.yaml -- every key of a project.yaml, with its default. A project.yaml lives in its project's root
# (never in this repository) and is the one input of workflows/pipeline/: fetch_igvf.py, submit.sh, run_project.sh,
# status.py. docs/new_project.md walks through starting one. Names here are placeholders.

project: example_course            # [A-Za-z0-9_]+; names the project in logs and STATUS.md
root: /data/mimir/example_course   # every output goes under it (project.py lists the layout); an absolute path
prefix: ex_                        # dataset name = prefix + stem (ex_t0, ...): igvf's dataset_name, every folder name
compendium: ex3                    # the tag of the project's motif compendium (09.0), [A-Za-z0-9_]+: Fi-NeMo calls
                                   # every dataset's hits against this one compendium, so a motif's name
                                   # (pos_patterns.<n>) means the same motif in every dataset

samples:
  # fragments: an IGVF file accession (fetch_igvf.py downloads and md5-checks it), or the absolute path of a BGZF
  #   fragments file named <stem>.fragments.tsv.gz. All fragments are used: a pseudobulk's file is already its cells.
  # md5: optional; checked against the file (and against the portal's, for an accession)
  # index: optional accession of the fragments' .tbi; extra: optional accessions kept in <root>/portal/ for the record
  # label: optional, for reports
  - {stem: t0, fragments: IGVFFI0000AAAA, md5: 00000000000000000000000000000000, index: IGVFFI0000AAAB,
     extra: [IGVFFI0000AAAC], label: "time point 0"}
  - {stem: t1, fragments: IGVFFI0000BBBA}
  - {stem: t2, fragments: /path/to/t2.fragments.tsv.gz}

# The stages run_project.sh runs, in this order whatever the order here (fetch runs before, on the login node). The
# default is the first six; coop_matrix (every dataset's DeepISA sites under every dataset's models: D x D coop_isa.py
# runs, ~6 GPU-min each) runs only when listed:
stages: [prep, train, attribute, downstream, motifs, cooperativity, coop_matrix]

# DeepISA (workflows/cooperativity/): groups of datasets pooled as one cell state, by stem (default: one group per
# sample, named by its stem), and comparisons [name, group_a, group_b]: the change b - a per TF pair and TF.
# series (optional): 3 or more groups in order (positions 0, 1, ...), e.g. the days of a time course: the trend of each
# TF pair and TF along them (combine.py and paired.py --series), computed in the coop_matrix stage.
cooperativity:
  groups:
    t0: [t0]
    t1: [t1]
    t2: [t2]
  comparisons:
    - [t0_t1, t0, t1]
    - [t1_t2, t1, t2]
    - [t0_t2, t0, t2]
  series: [t0, t1, t2]

# The references every step reads (required to run; no default): the directory setup.sh --references downloads
# into, with hg38/ (the IGVF GRCh38 no-alt genome and its .fai, chrom sizes, the ENCODE blacklist, GENCODE TSSs) and
# motif/ (the MotifCompendium database). The genome Cherimoya trains on is the one in it, the same file the steps
# read. On Gefion: /dcai/projects/iu_0109/annotations (docs/cluster.md).
reference_root: /data/mimir/references
# The chromosome folds (vendor/igvf_tf_chrombpnet/folds/fold_<k>.json: train/valid/test chromosomes):
folds: ["0", "1", "2", "3", "4"]

# Slurm (submit.sh; optional, and only for submit.sh: run_project.sh run by hand needs none). Each key becomes an
# sbatch option; a key left out is the cluster's default. gpus is --gres=gpu:<n>, cpus --cpus-per-task, extra any
# other options (a string or a list). On Gefion (docs/cluster.md):
#   slurm: {partition: defq, account: iu_0109, gpus: 8, cpus: 216, time: "2-00:00:00"}
slurm:
  partition: gpu
  gpus: 8
  time: "2-00:00:00"

# Box settings. Every slot is optional, and best left out: one left out is the value below scaled down to the
# machine the box runs on (its GPUs, CPUs and memory; project.py resolve_slots, logged by the preflight). The values
# below are what a whole Gefion node (8 H100, 216 CPUs, ~2 TB) gets; docs/pipeline.md says where each comes from. A
# value given here is used as it is, on any machine.
# slots:
#   train_per_gpu: 4        # Cherimoya fits per GPU (training is CPU/launch-bound)
#   train_cores: 6
#   attribute_per_gpu: 4    # `cherimoya attribute` processes per GPU (at most ~12 GB each)
#   attribute_cores: 4
#   modisco_max: 5          # TF-MoDISco (08.0) runs at once (~55 GB each)
#   modisco_threads: 24
#   finemo_slots: 5         # Fi-NeMo (10.0) runs at once, one GPU each
#   finemo_batch: 200       # below 200 for a compendium of more than ~450 patterns (10.0's header)
#   coop_cores: 16          # CPUs per DeepISA lane
#   prep_max: 0             # prep chains at once (~63 GB each); 0 = every dataset
hold_minutes: 60          # how long a box waits for a fix after a failed stage
shift_every: 100          # detect_shifts.py keeps every Nth fragment; ~100 for a 10-30 M-fragment file

# driver (default true): false marks a project set up by hand before the driver, kept for its results. project.py's
# check, status, prune and share work on it; env and coop-inputs refuse it, so run_project.sh and submit.sh do too.
driver: true

# prune (optional; docs/pipeline.md, "When a project is finished"): which of prune.py's rule sets apply (default
# [pipeline]; add chrombpnet for trained ChromBPNet models, variant_scoring for workflows/variant_scoring/ runs), the
# datasets <shared> stands for (a list or a file of names, relative to root), and the project's own keep and delete
# patterns, relative to root. A keep always wins, and nothing a stage check reads is ever deleted.
prune:
  rulesets: [pipeline]
